# Releases simple-release itself by dogfooding the action.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cut release and update major-version tag
        uses: ./
        with:
          release: 'true'
          major-tag: 'true'
          changelog-file: CHANGELOG.md
          insert-changelog-spacers: 'true'
          commit: 'true'
