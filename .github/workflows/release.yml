# Releases simple-release itself by dogfooding the action.
#
# On a `v*.*.*` tag push, this workflow uses the action to:
#   - roll the `[Unreleased]` section of CHANGELOG.md into a dated release section
#   - insert `&nbsp;` spacers into the extracted release notes
#   - publish a GitHub release whose body is those notes
#   - commit the updated CHANGELOG.md back to main
#   - force-move the matching major-version tag (e.g. `v1`) to the release commit

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cut release and update major-version tag
        uses: ./
        with:
          release: 'true'
          major-tag: 'true'
          changelog-file: CHANGELOG.md
          insert-changelog-spacers: 'true'
          commit: 'true'
